<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4EFE4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="floating.mana" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<title>Login · floating.mana</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  form { width: min(360px, 100%); background: #fff; border: 1px solid #E2D9C6; border-radius: 20px; padding: 24px; display: grid; gap: 12px; }
  img { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 4px; display: block; }
  h1 { margin: 0 0 8px; font-size: 22px; text-align: center; font-weight: 600; }
  input { font: inherit; font-size: 16px; padding: 12px; border: 1px solid #D5CBB5; border-radius: 12px; width: 100%; }
  button { font: inherit; font-size: 16px; min-height: 48px; border: 0; border-radius: 12px; background: #1F1D18; color: #F4EFE4; }
  .err { color: #A23B2A; font-size: 14px; min-height: 1.2em; text-align: center; }
</style>
</head>
<body>
<form id="f">
  <img src="/icons/icon-192.png" alt="" />
  <h1>floating.mana</h1>
  <input name="user" autocomplete="username" placeholder="Benutzer" autocapitalize="off" required />
  <input name="pass" type="password" autocomplete="current-password" placeholder="Passwort" required />
  <button>Anmelden</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: fd.get("user"), pass: fd.get("pass") }),
  });
  if (r.ok) {
    const next = new URLSearchParams(location.search).get("next");
    // nur interne Pfade zulassen
    location.href = next && next.startsWith("/") && !next.startsWith("//") ? next : "/queue.html";
  } else {
    document.getElementById("err").textContent = (await r.json().catch(() => ({}))).error || "Login fehlgeschlagen";
  }
};
</script>
</body>
</html>
