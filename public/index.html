<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>floating.mana — Deck Tech Generator</title>
<meta name="theme-color" content="#F4EFE4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="floating.mana" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>floating.mana</h1>
    <p class="subtitle">MTG Commander Deck Tech &rarr; Slides + Caption as ZIP</p>
  </header>

  <main>
    <section class="panel">
      <h2>Decklist</h2>

      <div class="tabs">
        <button type="button" class="tab active" data-kind="raw">Raw Text</button>
        <button type="button" class="tab" data-kind="moxfield">Moxfield URL</button>
        <button type="button" class="tab" data-kind="archidekt">Archidekt URL</button>
      </div>

      <textarea id="raw-input" rows="14" placeholder="Commander: Miirym, Sentinel Wyrm

1 Sol Ring
1 Arcane Signet
...

Sideboard:
1 Dragon Tempest
..."></textarea>

      <input id="moxfield-input" type="text" placeholder="https://www.moxfield.com/decks/xxxxxxxxxxxxxxxxxxxx" style="display:none" />
      <input id="archidekt-input" type="text" placeholder="https://archidekt.com/decks/xxxxxxx/deck-name" style="display:none" />

      <h2>Settings</h2>
      <div class="settings-grid">
        <label class="checkbox">
          <input id="use-llm" type="checkbox" />
          Generate LLM texts (Gameplan/Upgrades/Caption) (needs Anthropic API credit)
        </label>
      </div>

      <button id="generate-btn" class="primary">Generate</button>
      <p id="generate-status"></p>
    </section>

    <section class="panel">
      <h2>Jobs</h2>
      <div id="jobs-list"></div>
    </section>
  </main>

  <div id="edit-modal-root"></div>

  <script src="/app.js"></script>
<script src="/nav.js"></script>
</body>
</html>
