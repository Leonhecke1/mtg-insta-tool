<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4EFE4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="floating.mana" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<title>Freigabe · floating.mana</title>
<link rel="stylesheet" href="/style.css" />
<style>
  :root {
    --bg: #F4EFE4; --card: #fff; --line: #E2D9C6; --ink: #1F1D18; --muted: #7A7263;
    --ok: #D5E8D0; --info: #CFE0F2; --bad: #F4D2CC; --soft: #EDE5D3;
  }
  * { -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }

  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header.top h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header.top .count { font-size: 13px; color: var(--muted); }
  header.top a { color: var(--muted); font-size: 14px; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 16px 24px; }

  /* Aktionen: 2 grosse Buttons nebeneinander */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
  .msg { font-size: 14px; color: var(--muted); min-height: 1.2em; margin: 4px 0 8px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin: 4px 0 12px; }
  .toggle input { width: 20px; height: 20px; }

  button {
    font: inherit; font-size: 16px; min-height: 46px; padding: 10px 14px;
    border-radius: 12px; border: 1px solid var(--ink); background: var(--card); color: var(--ink);
    cursor: pointer; touch-action: manipulation;
  }
  button.primary { background: var(--ink); color: var(--bg); }
  button.ghost { border-color: var(--line); color: var(--muted); }
  button:disabled { opacity: .5; }

  input, select, textarea {
    font: inherit; font-size: 16px; /* 16px verhindert Auto-Zoom auf iOS */
    width: 100%; padding: 10px 12px; border: 1px solid #D5CBB5; border-radius: 10px; background: #fff; color: var(--ink);
  }
  textarea { min-height: 120px; resize: vertical; line-height: 1.4; }

  .day { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 4px 8px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0; font-size: 16px; line-height: 1.3; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .card h3 .title { overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }

  .pill { flex: none; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: var(--soft); white-space: nowrap; }
  .pill.approved { background: var(--ok); } .pill.published { background: var(--info); }
  .pill.failed { background: var(--bad); } .pill.rejected { background: #ddd; }

  /* Wischbare Vorschau */
  .thumbs { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -14px 10px; padding: 0 14px 4px; -webkit-overflow-scrolling: touch; }
  .thumbs img, .thumbs video { flex: none; scroll-snap-align: start; width: min(62vw, 240px); height: auto; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #000; }
  .thumbs video, .thumbs img.story { aspect-ratio: 9 / 16; }
  .thumbs .n { flex: none; align-self: center; font-size: 12px; color: var(--muted); padding: 0 4px; }

  .quote { background: var(--bg); padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; font-size: 15px; }
  .field { margin-top: 8px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  .btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btns.two { grid-template-columns: 1fr 1fr; }
  .err { color: #A23B2A; font-size: 14px; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  details.add { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
  details.add summary { font-size: 15px; cursor: pointer; min-height: 30px; display: flex; align-items: center; }
  details.add .grid { display: grid; gap: 8px; margin-top: 10px; }

  @media (min-width: 640px) {
    .thumbs img, .thumbs video { width: 200px; }
    details.add .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Freigabe</h1>
    <div class="count" id="count"></div>
  </div>
</header>

<div class="wrap">
  <div class="actions">
    <button class="primary" id="approveAll">Alle freigeben</button>
    <button id="fetchDeck">Neues Deck</button>
  </div>
  <div class="msg" id="fetchMsg"></div>
  <label class="toggle"><input type="checkbox" id="showDone" /> Erledigte anzeigen</label>

  <details class="add">
    <summary>Eigenen Post einplanen</summary>
    <div class="grid">
      <select id="jobSel" aria-label="Deck"></select>
      <select id="kindSel" aria-label="Typ">
        <option value="carousel">Carousel</option>
        <option value="story">Story (1. Slide)</option>
        <option value="image">Einzelbild</option>
        <option value="reel">Reel (Karte + Slides)</option>
      </select>
      <input type="datetime-local" id="whenInp" aria-label="Zeitpunkt" />
      <input type="text" id="hookInp" placeholder="Hook fürs Reel (leer = Tagline)" />
      <button id="addBtn">Als Entwurf anlegen</button>
    </div>
    <div class="err" id="addErr"></div>
  </details>

  <div id="list"></div>
</div>

<script src="/nav.js"></script>
<script>
const KIND = { carousel: "Carousel", image: "Bild", story: "Story", reel: "Reel", comment_reply: "Antwort" };
const STATUS = { draft: "Entwurf", approved: "freigegeben", publishing: "wird gepostet", published: "veröffentlicht", failed: "fehlgeschlagen", rejected: "abgelehnt" };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toLocal = (iso) => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

function dayLabel(iso) {
  const d = new Date(iso), today = new Date();
  const key = (x) => x.toDateString();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const base = d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
  if (key(d) === key(today)) return "Heute · " + base;
  if (key(d) === key(tomorrow)) return "Morgen · " + base;
  return base;
}

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = "/login.html?next=" + encodeURIComponent(location.pathname); throw new Error("login required"); }
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

// Nicht neu laden, waehrend jemand tippt oder ungespeicherte Aenderungen hat
let dirty = false;
const busy = () => dirty || ["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement?.tagName);

async function load(force) {
  if (!force && busy()) return;
  const items = await api("GET", "/api/queue");
  const showDone = document.getElementById("showDone").checked;
  const visible = items.filter((i) => showDone || !["published", "rejected"].includes(i.status));
  const drafts = items.filter((i) => i.status === "draft").length;
  document.getElementById("count").textContent = drafts ? `${drafts} warten auf Freigabe` : "Alles freigegeben";
  document.title = (drafts ? `(${drafts}) ` : "") + "Freigabe · floating.mana";

  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!visible.length) { list.innerHTML = `<p class="empty">Nichts offen.</p>`; return; }

  let lastDay = "";
  for (const it of visible) {
    const day = it.kind === "comment_reply" ? "Antworten auf Kommentare" : dayLabel(it.scheduledAt);
    if (day !== lastDay) {
      list.insertAdjacentHTML("beforeend", `<div class="day">${esc(day)}</div>`);
      lastDay = day;
    }
    list.appendChild(render(it));
  }
  dirty = false;
  if (window.updateNavBadge) window.updateNavBadge();
}

function preview(it) {
  if (!it.previewUrls.length) return "";
  const items = it.previewUrls.map((u) =>
    u.endsWith(".mp4")
      ? `<video src="${u}" controls playsinline preload="metadata"></video>`
      : `<img src="${u}" loading="lazy" alt="" class="${it.kind === "story" ? "story" : ""}">`
  ).join("");
  const n = it.previewUrls.length > 1 ? `<span class="n">${it.previewUrls.length} Slides</span>` : "";
  return `<div class="thumbs">${items}${n}</div>`;
}

function render(it) {
  const el = document.createElement("div");
  el.className = "card";
  const editable = ["draft", "approved", "failed"].includes(it.status);
  const isReply = it.kind === "comment_reply";
  const canApprove = editable && it.status !== "approved";

  const meta = isReply
    ? (it.status === "approved" ? `Geht automatisch raus um ${fmtTime(it.scheduledAt)}` : "")
    : `${fmtTime(it.scheduledAt)} Uhr`;

  el.innerHTML = `
    <h3><span class="title">${esc(KIND[it.kind])} · ${esc(it.label || "")}</span><span class="pill ${it.status}">${esc(STATUS[it.status])}</span></h3>
    ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
    ${preview(it)}
    ${isReply ? `<div class="quote"><b>@${esc(it.commentUsername)}:</b> ${esc(it.commentText)}</div>` : ""}
    ${it.kind === "story" ? "" : `<div class="field"><label>${isReply ? "Antwort" : "Caption"}</label><textarea ${editable ? "" : "disabled"}>${esc(isReply ? it.replyText : it.caption)}</textarea></div>`}
    ${!isReply && editable ? `<div class="field"><label>Zeitpunkt</label><input type="datetime-local" value="${toLocal(it.scheduledAt)}"></div>` : ""}
    ${it.error ? `<div class="err">${esc(it.error)}</div>` : ""}
    ${editable ? `<div class="btns ${canApprove ? "" : "two"}">
      ${canApprove ? `<button class="primary" data-a="approve">Freigeben</button>` : ""}
      <button data-a="save">Speichern</button>
      <button class="ghost" data-a="reject">Ablehnen</button>
    </div>` : ""}`;

  el.addEventListener("input", () => { dirty = true; });
  el.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-a]");
    if (!btn) return;
    const a = btn.dataset.a;
    el.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      if (a === "save" || a === "approve") {
        const ta = el.querySelector("textarea");
        const dt = el.querySelector('input[type="datetime-local"]');
        const patch = {};
        if (ta) patch[isReply ? "replyText" : "caption"] = ta.value;
        if (dt && dt.value) patch.scheduledAt = new Date(dt.value).toISOString();
        await api("PATCH", `/api/queue/${it.id}`, patch);
      }
      if (a === "approve") await api("POST", `/api/queue/${it.id}/approve`);
      if (a === "reject") await api("POST", `/api/queue/${it.id}/reject`);
      dirty = false;
      load(true);
    } catch (err) {
      el.querySelectorAll("button").forEach((b) => (b.disabled = false));
      alertBox(el, err.message);
    }
  });
  return el;
}

function alertBox(el, msg) {
  let e = el.querySelector(".err.live");
  if (!e) { e = document.createElement("div"); e.className = "err live"; el.appendChild(e); }
  e.textContent = msg;
}

const msg = document.getElementById("fetchMsg");

document.getElementById("approveAll").onclick = async (ev) => {
  ev.target.disabled = true;
  try {
    const r = await api("POST", "/api/queue/approve-all");
    msg.textContent = `${r.approved.length} freigegeben` + (r.skipped.length ? `, ${r.skipped.length} übersprungen (z. B. leere Antwort)` : "");
    dirty = false;
    load(true);
  } catch (err) { msg.textContent = err.message; }
  finally { ev.target.disabled = false; }
};

document.getElementById("showDone").onchange = () => load(true);

document.getElementById("fetchDeck").onclick = async () => {
  const btn = document.getElementById("fetchDeck");
  btn.disabled = true; btn.textContent = "Lädt …";
  msg.textContent = "Suche und rendere Deck (bis zu 2 Minuten) …";
  try {
    const r = await api("POST", "/api/queue/fetch-deck");
    msg.textContent = `${r.label} für ${new Date(r.scheduledAt).toLocaleDateString("de-DE")} angelegt.`;
    load(true);
  } catch (err) {
    msg.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = "Neues Deck";
  }
};

(async () => {
  const jobs = await api("GET", "/api/jobs");
  document.getElementById("jobSel").innerHTML = jobs.filter((j) => j.status === "ready")
    .map((j) => `<option value="${j.id}">${esc(j.deckSummary?.commander || j.id)}</option>`).join("");
  const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(19, 0, 0, 0);
  document.getElementById("whenInp").value = toLocal(d.toISOString());
})();

document.getElementById("addBtn").onclick = async () => {
  const btn = document.getElementById("addBtn");
  btn.disabled = true; btn.textContent = "Wird erstellt …";
  try {
    await api("POST", "/api/queue", {
      jobId: document.getElementById("jobSel").value,
      kind: document.getElementById("kindSel").value,
      scheduledAt: new Date(document.getElementById("whenInp").value).toISOString(),
      hook: document.getElementById("hookInp").value || undefined,
    });
    document.getElementById("addErr").textContent = "";
    load(true);
  } catch (err) { document.getElementById("addErr").textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = "Als Entwurf anlegen"; }
};

load(true);
setInterval(() => load(false), 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
</script>
</body>
</html>
